app:
  modeldir: /scratch3/BMC/gsd-fv3/aigfs_input/aigfs-v1.1/model
  platform:
    name: ursa
    partition:
      compute: u1-compute
      netaccess: u1-service
      task: u1-service
    scheduler:
      type: slurm
forecast:
  aigfs_inference:
    execution:
      batchargs:
        partition: '{{ app.platform.partition.compute }}'
post:
  aigfs_post:
    execution:
      batchargs:
        partition: '{{ app.platform.partition.task }}'
prep:
  aigfs_ics:
    execution:
      batchargs:
        partition: '{{ app.platform.partition.task }}'
    files_to_hardlink:
      data/{{ app.time.m1_yyyymmdd }}-gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/gfs.{{ app.time.m1_yyyymmdd }}/{{ app.time.m1_hh }}/atmos/gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f000'
      data/{{ app.time.m1_yyyymmdd }}-gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/gfs.{{ app.time.m1_yyyymmdd }}/{{ app.time.m1_hh }}/atmos/gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f006'
      data/{{ app.time.m2_yyyymmdd }}-gfs.t{{ app.time.m2_hh }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/gfs.{{ app.time.m2_yyyymmdd }}/{{ app.time.m2_hh }}/atmos/gfs.t{{ app.time.m2_hh }}z.pgrb2.0p25.f006'
      data/{{ app.time.yyyymmdd }}-gfs.t{{ app.time.hh }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/gfs.{{ app.time.yyyymmdd }}/{{ app.time.hh }}/atmos/gfs.t{{ app.time.hh }}z.pgrb2.0p25.f000'
user:
  gfs_data: https://noaa-gfs-bdp-pds.s3.amazonaws.com
workflow:
  tasks:
    task_prep:
      partition: "{{ app.platform.partition.task }}"
    task_forecast:
      partition: "{{ app.platform.partition.compute }}"
    metatask_post:
      task_post_#fhr#:
        partition: "{{ app.platform.partition.task }}"
    task_all:
      partition: "{{ app.platform.partition.task }}"
