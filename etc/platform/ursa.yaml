app:
  modeldir: /home/role.rtaigfs/model
  platform:
    name: ursa
    partition:
      compute: u1-compute
      netaccess: u1-service
      task: u1-service
    scheduler:
      type: slurm
forecast:
  aigfs_inference:
    execution:
      batchargs:
        partition: '{{ app.platform.partition.compute }}'
post:
  aigfs_post:
    execution:
      batchargs:
        partition: '{{ app.platform.partition.task }}'
prep:
  aigfs_ics:
    execution:
      batchargs:
        partition: '{{ app.platform.partition.task }}'
    files_to_hardlink:
      data/{{ app.time.yyyymmdd }}-gfs.t{{ app.time.hh }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/{{ app.time.yyyymmdd }}/gfs.t{{ app.time.hh }}z.pgrb2.0p25.f000'
      data/{{ app.time.m1_yyyymmdd }}-gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/{{ app.time.m1_yyyymmdd }}/gfs.t{{ app.time.m1_hh}}z.pgrb2.0p25.f000'
      data/{{ app.time.m1_yyyymmdd }}-gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/{{ app.time.m1_yyyymmdd }}/gfs.t{{ app.time.m1_hh}}z.pgrb2.0p25.f006'
      data/{{ app.time.m2_yyyymmdd }}-gfs.t{{ app.time.m2_hh }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/{{ app.time.m2_yyyymmdd }}/gfs.t{{ app.time.m2_hh }}z.pgrb2.0p25.f006'
user:
  gfs_data: /public/data/grids/gfs/0p25deg/grib2
workflow:
  tasks:
    task_prep:
      partition: "{{ app.platform.partition.task }}"
    task_forecast:
      partition: "{{ app.platform.partition.compute }}"
    metatask_post:
      task_post_#fhr#:
        partition: "{{ app.platform.partition.task }}"
    task_all:
      partition: "{{ app.platform.partition.task }}"
