app:
  home: /lfs/h2/emc/noscrub/{{ 'USER' | env }}/aigfs
  modeldir: '{{ app.home }}/fix'
  platform:
    name: wcoss2
    scheduler:
      type: pbs
  rundir: /lfs/h2/emc/stmp/{{ 'USER' | env }}/aigfs/run
forecast:
  aigfs_inference:
    execution:
      envcmds:
        - module load workflow-wcoss2
    model_weights_path: '{{ app.modeldir }}/params/weights.npz'
post:
  aigfs_post:
    execution:
      envcmds:
        - module load workflow-wcoss2
prep:
  aigfs_ics:
    execution:
      envcmds:
        - module load workflow-wcoss2
    files_to_hardlink:
      data/{{ app.time.yyyymmdd }}-gfs.t{{ app.time.hh }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/gfs.{{ app.time.yyyymmdd }}/{{ app.time.hh }}/atmos/gfs.t{{ app.time.hh }}z.pgrb2.0p25.f000'
      data/{{ app.time.m1_yyyymmdd }}-gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/gfs.{{ app.time.m1_yyyymmdd }}/{{ app.time.m1_hh }}/atmos/gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f000'
      data/{{ app.time.m1_yyyymmdd }}-gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/gfs.{{ app.time.m1_yyyymmdd }}/{{ app.time.m1_hh }}/atmos/gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f006'
      data/{{ app.time.m2_yyyymmdd }}-gfs.t{{ app.time.m2_hh }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/gfs.{{ app.time.m2_yyyymmdd }}/{{ app.time.m2_hh }}/atmos/gfs.t{{ app.time.m2_hh }}z.pgrb2.0p25.f006'
user:
  gfs_data: /lfs/h1/ops/prod/com/gfs/v16.3

# WCOSS2-specific config overlay for uw-aigfs.
# Fork of etc/base.yaml — do NOT edit base.yaml for WCOSS2 changes;
# that file is kept intact for parallel Ursa/RDHPCS development.
#
# User paths use {{ 'USER' | env }} to resolve the USER environment variable at
# runtime — no manual substitution needed.
#
# GFS data note: WCOSS2 ops GFS files live at
#   /lfs/h1/ops/prod/com/gfs/v16.3/gfs.<yyyymmdd>/<hh>/atmos/gfs.t<hh>z.pgrb2.0p25.f<fff>
# user.gfs_data holds the versioned COMROOT base; files_to_hardlink paths include the
# gfs.<yyyymmdd>/<hh>/atmos/ subdirectory nesting to match the ops structure.
# Both v16.2 and v16.3 exist on WCOSS2; v16.3 is the current operational version.
#
# The fix/ directory (~150 GB) must be staged in the repo clone before the first run.
#
# Data retention confirmed 2026-07-28: oldest available directory is gfs.20260710
# (18 days of retention). The m2 cycle requires only 12 hours back — well within
# the retention window under normal and high-load conditions.
