app:
  # The following must all be defined by a user config:
  #   cycle_freq: !timedelta 6
  #   first_cycle: !datetime YYYY-mm-ddTHH
  #   home: /path/to/git/clone
  #   last_cycle: !datetime YYYY-mm-ddTHH
  #   modeldir: /path/to/model/directory
  #   rundir: /path/to/root/of/run/directories
  # Two values are reserved and set automatically:
  #   home: /path/to/app/home/directory
  #   platform: platform-name
timevars:
  cyc: '{{ cycle.strftime("%H") }}'
  fff: '{{ "%03d" % (leadtime.total_seconds() // 3600) }}'
  yyyymmddhh: '{{ cycle.strftime("%Y%m%d%H") }}'
prep:
  aigfs_ics:
    execution:
      batchargs:
        debug: True
        memory: 10GB
        nodes: 1
        tasks_per_node: 1
        walltime: 00:01:00
      envcmds:
        - source {{ app.home }}/bin/activate-{{ app.platform.name }}
        - module load wgrib2
      executable: uw execute --module aigfs.drivers.ics --classname AIGFSICs --task merged_netcdf_files -c {{ app.rundir }}/aigfs.yaml --cycle {{ cycle.strftime('%Y-%m-%d_%H:%M:%S') }} --key-path prep
    rundir: '{{ app.rundir }}/{{ cycle.strftime("%Y%m%d%H") }}/prep'
    variable_extraction_yaml: '{{ app.home }}/etc/wgrib2.yaml'
  platform:
    account: '{{ platform.account }}'
    scheduler: '{{ platform.scheduler }}'
forecast:
  aigfs_inference:
    diffs_stddev_path: '{{ app.modeldir }}/stats/diffs_stddev_by_level.nc'
    execution:
      batchargs:
        debug: True
        memory: 150GB
        nodes: 1
        tasks_per_node: 128
        walltime: 00:20:00
      envcmds:
        - source {{ app.home }}/bin/activate-{{ app.platform.name }}
        - set -x
      executable: uw execute --module aigfs.drivers.inference --classname AIGFSInference --task predictions -c {{ app.rundir }}/aigfs.yaml --cycle {{ cycle.strftime('%Y-%m-%d_%H:%M:%S') }} --key-path forecast
    forecast_freq: 6
    forecast_length: 120
    ics_path: '{{ prep.aigfs_ics.rundir }}/aigfs.t{{ timevars.cyc }}z.ic.nc'
    json_path: '{{ app.modeldir }}/tables'
    mean_path: '{{ app.modeldir }}/stats/mean_by_level.nc'
    model_weights_path: '{{ app.modeldir }}/params/weights.npz'
    rundir: '{{ app.rundir }}/{{ cycle.strftime("%Y%m%d%H") }}/forecast'
    stddev_path: '{{ app.modeldir }}/stats/stddev_by_level.nc'
  platform:
    account: '{{ platform.account }}'
    scheduler: '{{ platform.scheduler }}'
post:
  aigfs_post:
    execution:
      batchargs:
        debug: True
        memory: 4GB
        nodes: 1
        tasks_per_node: 1
        walltime: 00:01:00
      envcmds:
        - source {{ app.home }}/bin/activate-{{ app.platform.name }}
        - module load wgrib2
      executable: uw execute --module aigfs.drivers.post --classname AIGFSPost --task delivery -c {{ app.rundir }}/aigfs.yaml --cycle {{ cycle.strftime('%Y-%m-%d_%H:%M:%S') }} --key-path post --leadtime $FHR
    deliver_to: '{{ forecast.aigfs_inference.rundir }}'
    inputfiles:
      - '{{ forecast.aigfs_inference.rundir }}/aigfs.t{{ timevars.cyc }}z.sfc.f{{ timevars.fff }}.grib2'
      - '{{ forecast.aigfs_inference.rundir }}/aigfs.t{{ timevars.cyc }}z.pres.f{{ timevars.fff }}.grib2'
    outputdir: '{{ post.aigfs_post.rundir }}'
    rundir: '{{ app.rundir }}/{{ timevars.yyyymmddhh }}/post_{{ timevars.fff }}'
  platform:
    account: '{{ platform.account }}'
    scheduler: '{{ platform.scheduler }}'
