---
- name: Create rtaigfs install directory
  ansible.builtin.file:
    path: "{{ rtaigfs_install_dir | realpath }}"
    state: directory
    mode: "0755"

- name: Install rtaigfs launcher
  ansible.builtin.copy:
    src: rtaigfs
    dest: "{{ rtaigfs_install_dir | realpath }}/rtaigfs"
    mode: "0755"
