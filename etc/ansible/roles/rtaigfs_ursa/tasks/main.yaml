---
- name: Create rtaigfs install directory
  ansible.builtin.file:
    path: "{{ rtaigfs_install_dir | realpath }}"
    state: directory
    mode: "0755"

- name: Create rtaigfs bin directory
  ansible.builtin.file:
    path: "{{ rtaigfs_bin_dir }}"
    state: directory
    mode: "0755"

- name: Create Babashka download directory
  ansible.builtin.file:
    path: "{{ rtaigfs_babashka_download_dir }}"
    state: directory
    mode: "0755"

- name: Download Babashka installer
  ansible.builtin.get_url:
    url: "{{ rtaigfs_babashka_installer_url }}"
    dest: "{{ rtaigfs_babashka_installer_path }}"
    mode: "0755"

- name: Install Babashka bb executable
  ansible.builtin.command:
    argv: >-
      {{
        [rtaigfs_babashka_installer_path, '--dir', rtaigfs_bin_dir]
        + (['--version', rtaigfs_babashka_version] if rtaigfs_babashka_version else [])
        + ['--download-dir', rtaigfs_babashka_download_dir]
      }}
    creates: "{{ rtaigfs_bin_dir }}/bb"

- name: Install rtaigfs launcher
  ansible.builtin.copy:
    src: rtaigfs
    dest: "{{ rtaigfs_bin_dir }}/rtaigfs"
    mode: "0755"

- name: Install report launcher
  ansible.builtin.copy:
    src: report
    dest: "{{ rtaigfs_bin_dir }}/report"
    mode: "0755"

- name: Install rtaigfs configuration
  ansible.builtin.copy:
    src: rtaigfs.yaml
    dest: "{{ rtaigfs_install_dir | realpath }}/rtaigfs.yaml"
    mode: "0644"

- name: Extract rtaigfs model archive
  ansible.builtin.unarchive:
    src: "{{ rtaigfs_model_archive_path }}"
    dest: "{{ rtaigfs_install_dir | realpath }}"
    remote_src: true
    creates: "{{ rtaigfs_install_dir | realpath }}/model"

- name: Render rtaigfs crontab
  ansible.builtin.template:
    src: crontab.j2
    dest: "{{ rtaigfs_crontab_path }}"
    mode: "0644"

- name: Install rtaigfs crontab
  ansible.builtin.command:
    argv:
      - crontab
      - "{{ rtaigfs_crontab_path }}"
  changed_when: true
