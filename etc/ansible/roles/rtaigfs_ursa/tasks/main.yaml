---
- name: Create rtaigfs install directory
  ansible.builtin.file:
    path: "{{ rtaigfs_install_dir | realpath }}"
    state: directory
    mode: "0755"

- name: Create rtaigfs bin directory
  ansible.builtin.file:
    path: "{{ rtaigfs_bin_dir }}"
    state: directory
    mode: "0755"

- name: Check for bb executable
  ansible.builtin.stat:
    path: "{{ rtaigfs_bin_dir }}/bb"
  register: rtaigfs_bb

- name: Install bb executable
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL {{ rtaigfs_bb_url | quote }} | tar -xzO bb > {{ (rtaigfs_bin_dir ~ '/bb') | quote }}
    executable: /bin/bash
  changed_when: true
  when: not rtaigfs_bb.stat.exists

- name: Set bb executable mode
  ansible.builtin.file:
    path: "{{ rtaigfs_bin_dir }}/bb"
    mode: "0755"

- name: Install run launcher
  ansible.builtin.copy:
    src: run
    dest: "{{ rtaigfs_bin_dir }}/run"
    mode: "0755"

- name: Install report launcher
  ansible.builtin.copy:
    src: report
    dest: "{{ rtaigfs_bin_dir }}/report"
    mode: "0755"

- name: Install rtaigfs configuration
  ansible.builtin.copy:
    src: rtaigfs.yaml
    dest: "{{ rtaigfs_install_dir | realpath }}/rtaigfs.yaml"
    mode: "0644"

- name: Extract rtaigfs model archive
  ansible.builtin.unarchive:
    src: "{{ rtaigfs_model_archive_path }}"
    dest: "{{ rtaigfs_install_dir | realpath }}"
    remote_src: true
    creates: "{{ rtaigfs_install_dir | realpath }}/model"


