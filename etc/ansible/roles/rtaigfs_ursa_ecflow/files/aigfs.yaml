app:
  cycle_freq: !timedelta 6
  modeldir: '{{ "MODELDIR" | env }}'
  platform:
    scheduler:
      account: gsd-fv3
  rundir: '{{ "RUNDIR" | env }}'
forecast:
  aigfs_inference:
    forecast_length: 120
prep:
  aigfs_ics:
    files_to_copy:
      data/{{ app.time.m1_yyyymmdd }}-gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/{{ user.m1_yyjjjhh }}000000'
      data/{{ app.time.m1_yyyymmdd }}-gfs.t{{ app.time.m1_hh }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/{{ user.m1_yyjjjhh }}000006'
      data/{{ app.time.m2_yyyymmdd }}-gfs.t{{ app.time.m2_hh }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/{{ user.m2_yyjjjhh }}000006'
      data/{{ app.time.yyyymmdd }}-gfs.t{{ app.time.hh }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/{{ user.yyjjjhh }}000000'
user:
  active_cycles: 4
  window_cycles: 12
  gfs_data: /public/data/grids/gfs/0p25deg/grib2
  m1_yyjjjhh: '{{ (cycle - app.time.m6h).strftime("%y%j%H") }}'
  m2_yyjjjhh: '{{ (cycle - 2 * app.time.m6h).strftime("%y%j%H") }}'
  yyjjjhh: '{{ cycle.strftime("%y%j%H") }}'
