---
- name: Configure rtaigfs-ursa
  hosts: localhost
  gather_facts: true

  vars_files:
    - ../roles/rtaigfs_ursa/defaults/main.yaml

  vars:
    rtaigfs_app: "{{ rtaigfs_app_parent }}/app"
    rtaigfs_app_save: "{{ rtaigfs_app_parent }}/app.{{ rtaigfs_save_ts }}"
    rtaigfs_app_parent: "{{ (playbook_dir + '/../../..') | realpath }}"
    rtaigfs_crontab_save: "{{ rtaigfs_root }}/rtaigfs-crontab.{{ rtaigfs_save_ts }}"
    rtaigfs_is_service_user: "{{ ansible_facts['user_id'] == rtaigfs_user }}"
    rtaigfs_root: "{{ lookup('ansible.builtin.env', 'PWD') }}"

  pre_tasks:
    - name: Set timestamp
      ansible.builtin.set_fact:
        rtaigfs_save_ts: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"

    - name: Save crontab
      ansible.builtin.shell:
        cmd: "crontab -l >{{ rtaigfs_crontab_save }} 2>/dev/null || : >{{ rtaigfs_crontab_save }}"
        executable: /bin/bash
      changed_when: false
      when: rtaigfs_is_service_user

  tasks:
    - name: Deploy RTAIGFS
      block:
        - name: Unload crontab
          ansible.builtin.command:
            argv: [crontab, -r]
          register: rtaigfs_crontab_unload
          failed_when:
            - rtaigfs_crontab_unload.rc != 0
            - "'no crontab' not in (rtaigfs_crontab_unload.stderr | default(''))"
          changed_when: rtaigfs_crontab_unload.rc == 0
          when: rtaigfs_is_service_user

        - name: git pull
          ansible.builtin.command:
            cmd: git pull --ff-only
            chdir: "{{ rtaigfs_root }}"
          register: rtaigfs_git_pull
          changed_when: "'Already up to date' not in rtaigfs_git_pull.stdout"

        - name: Does app/ exist?
          ansible.builtin.stat:
            path: "{{ rtaigfs_app }}"
          register: rtaigfs_app_stat

        - name: Save app/
          ansible.builtin.command:
            argv: [mv, "{{ rtaigfs_app }}", "{{ rtaigfs_app_save }}"]
          when: rtaigfs_app_stat.stat.exists
          changed_when: true

        - name: Run rtaigfs_ursa role
          ansible.builtin.include_role:
            name: rtaigfs_ursa

        - name: Are there saved cycles?
          ansible.builtin.stat:
            path: "{{ rtaigfs_app_save }}/cycles"
          register: rtaigfs_cycles_stat
          when: rtaigfs_app_stat.stat.exists

        - name: Restore saved cycles
          ansible.builtin.command:
            argv: [mv, "{{ rtaigfs_app_save }}/cycles", "{{ rtaigfs_app }}/cycles"]
          when:
            - rtaigfs_app_stat.stat.exists
            - rtaigfs_cycles_stat.stat.exists | default(false)
          changed_when: true

        - name: Remove saved app/
          ansible.builtin.file:
            path: "{{ rtaigfs_app_save }}"
            state: absent
          when: rtaigfs_app_stat.stat.exists

        - name: Install crontab
          ansible.builtin.command:
            argv: [crontab, "-"]
            stdin: "{{ lookup('ansible.builtin.template', '../roles/rtaigfs_ursa/templates/crontab.j2') }}"
          changed_when: true
          when: rtaigfs_is_service_user

      rescue:
        - name: ROLLBACK: Initial notice
          ansible.builtin.debug:
            msg: |
              ============================================================
              DEPLOYMENT FAILED — rolling back.
              Failed task: {{ ansible_failed_task.name | default('unknown') }}
              Error: {{ ansible_failed_result.msg | default(ansible_failed_result) }}
              ============================================================

        - name: ROLLBACK: Remove broken app/
          ansible.builtin.file:
            path: "{{ rtaigfs_app }}"
            state: absent
          when: (rtaigfs_app_stat.stat.exists | default(false))

        - name: ROLLBACK: Restore saved app/
          ansible.builtin.command:
            argv: [mv, "{{ rtaigfs_app_save }}", "{{ rtaigfs_app }}"]
          when: (rtaigfs_app_stat.stat.exists | default(false))
          changed_when: true

        - name: ROLLBACK: Reload saved crontab
          ansible.builtin.shell:
            cmd: >-
              if [ -s {{ rtaigfs_crontab_save }} ]; then
                crontab {{ rtaigfs_crontab_save }};
              fi
          changed_when: true
          when: rtaigfs_is_service_user

        - name: ROLLBACK: Final notice
          ansible.builtin.fail:
            msg: |
              ============================================================
              DEPLOYMENT ROLLED BACK.
              See failure message above for the root cause.
              ============================================================
