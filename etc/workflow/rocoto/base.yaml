workflow:
  attrs:
    realtime: False
    scheduler: '{{ app.platform.scheduler.type }}'
  cycledef:
    - attrs:
        group: forecast
      spec: '{{ app.first_cycle.strftime("%Y%m%d%H%M") }} {{ app.last_cycle.strftime("%Y%m%d%H%M") }} {{ app.cycle_freq}}'
  log:
    value: '&LOGDIR;/workflow.log'
  entities:
    APPDIR: '{{ app.home }}'
    CONFIG: '{{ app.rundir}}/aigfs.yaml'
    LOGDIR: '{{ app.rundir}}/logs'
    PLATFORM: '{{ app.platform.name }}'
  tasks:
    task_prep:
      account: '{{ app.platform.scheduler.account }}'
      command:
        cyclestr:
          value: source &APPDIR;/bin/activate-&PLATFORM; && uw execute
            --module aigfs.drivers.ics
            --classname AIGFSICs
            --task run
            --config &CONFIG;
            --cycle @Y-@m-@dT@H
            --key-path prep
      cores: !int '{{ prep.aigfs_ics.execution.cores }}'
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      memory: '{{ prep.aigfs_ics.execution.batchargs.memory }}'
      walltime: '{{ prep.aigfs_ics.execution.batchargs.walltime }}'
    task_forecast:
      account: '{{ app.platform.scheduler.account }}'
      attrs:
        maxtries: 3
      command:
        cyclestr:
          value: source &APPDIR;/bin/activate-&PLATFORM; && uw execute
            --module aigfs.drivers.inference
            --classname AIGFSInference
            --task run
            --config &CONFIG;
            --cycle @Y-@m-@dT@H
            --key-path forecast
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      nodes: '{{ forecast.aigfs_inference.execution.batchargs.nodes }}:ppn={{ forecast.aigfs_inference.execution.batchargs.tasks_per_node }}'
      memory: '{{ forecast.aigfs_inference.execution.batchargs.memory }}'
      walltime: '{{ forecast.aigfs_inference.execution.batchargs.walltime }}'
      dependency:
        taskdep:
          attrs:
            task: prep
    metatask_post:
      var:
        fhr: '{% for x in range(0, forecast.aigfs_inference.forecast_length + 1, forecast.aigfs_inference.forecast_freq) %}{{"%03d" | format(x)}}{% if not loop.last %} {% endif %}{% endfor %}'
      task_post_#fhr#:
        account: '{{ app.platform.scheduler.account }}'
        attrs:
          maxtries: 3
        command:
          cyclestr:
            value: 'source &APPDIR;/bin/activate-&PLATFORM; &&
              uw execute
              --module aigfs.drivers.post
              --classname AIGFSPost
              --task run
              --config &CONFIG;
              --cycle @Y-@m-@dT@H
              --key-path post
              --leadtime #fhr#'
        cores: !int '{{ post.aigfs_post.execution.cores }}'
        join:
          cyclestr:
            value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
        envars:
          FHR: '#fhr#'
        memory: '{{ post.aigfs_post.execution.batchargs.memory }}'
        walltime: '{{ post.aigfs_post.execution.batchargs.walltime }}'
        dependency:
          and:
            datadep_pres:
              value:
                cyclestr:
                  value: '{{ app.rundir }}/@Y@m@d@H/forecast/aigfs.t@Hz.pres.f#fhr#.grib2'
            datadep_sfc:
              value:
                cyclestr:
                  value: '{{ app.rundir }}/@Y@m@d@H/forecast/aigfs.t@Hz.sfc.f#fhr#.grib2'
    task_all:
      account: '{{ app.platform.scheduler.account }}'
      command: /bin/true
      cores: 1
      dependency:
        metataskdep:
          attrs:
            metatask: post
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      walltime: 00:00:01
