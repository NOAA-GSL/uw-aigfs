workflow:
  attrs:
    realtime: False
    scheduler: "{{ platform.scheduler }}"
  cycledef:
    - attrs:
        group: forecast
      spec: "{{ user.first_cycle.strftime('%Y%m%d%H%M') }} {{ user.last_cycle.strftime('%Y%m%d%H%M') }} {{user.cycle_freq}}"
  log:
    value: "{{ user.rundir }}/workflow.log"
  entities:
    AIGFS_APP: "{{ user.app_home }}"
    EXPERIMENT_CONFIG: "{{user.rundir}}/experiment.yaml"
    LOGDIR: "{{user.rundir}}/log"
    PLATFORM: "{{ user.platform }}"
  tasks:
    task_prep:
      account: "{{ platform.account }}"
      attrs:
        maxtries: 3
      command:
        cyclestr:
          value: source &AIGFS_APP;/bin/activate-&PLATFORM; && uw execute
            --module &AIGFS_APP;/drivers/aigfs_ics.py
            --classname AIGFSICs
            --task run
            --config &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H
            --key-path prep
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      memory: "{{ prep.aigfs_ics.execution.batchargs.memory }}"
      nodes: "{{ prep.aigfs_ics.execution.batchargs.nodes }}:ppn={{ prep.aigfs_ics.execution.batchargs.tasks_per_node }}"
      walltime: "{{ prep.aigfs_ics.execution.batchargs.walltime }}"
    task_forecast:
      account: "{{ platform.account }}"
      attrs:
        maxtries: 3
      command:
        cyclestr:
          value: source &AIGFS_APP;/bin/activate-&PLATFORM; && uw execute
            --module &AIGFS_APP;/drivers/aigfs_inference.py
            --classname AIGFSInference
            --task run
            --config &EXPERIMENT_CONFIG;
            --cycle @Y-@m-@dT@H
            --key-path forecast
      join:
        cyclestr:
          value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
      nodes: "{{ forecast.aigfs_inference.execution.batchargs.nodes }}:ppn={{ forecast.aigfs_inference.execution.batchargs.tasks_per_node }}"
      memory: "{{ forecast.aigfs_inference.execution.batchargs.memory }}"
      walltime: "{{ forecast.aigfs_inference.execution.batchargs.walltime }}"
      dependency:
        taskdep:
          attrs:
            task: prep
    metatask_post:
      var:
        fhr: "{% for h in range(0, forecast.aigfs_inference.forecast_length + 1, forecast.aigfs_inference.forecast_freq) %}{{ ' %03d' % h }}{% endfor %}"
        nextfhr: "{% for h in range(forecast.aigfs_inference.forecast_freq, forecast.aigfs_inference.forecast_length + forecast.aigfs_inference.forecast_freq + 1, forecast.aigfs_inference.forecast_freq) %}{{ ' %03d' % h }}{% endfor %}"
      task_post_#fhr#:
        account: "{{ platform.account }}"
        attrs:
          maxtries: 3
        command:
          cyclestr:
            value: "source &AIGFS_APP;/bin/activate-&PLATFORM; &&
              uw execute
              --module &AIGFS_APP;/drivers/aigfs_post.py
              --classname AIGFSPost
              --task run
              --config &EXPERIMENT_CONFIG;
              --cycle @Y-@m-@dT@H
              --key-path post
              --leadtime #fhr#"
        join:
          cyclestr:
            value: '&LOGDIR;/{{ jobname }}_@Y@m@d@H.log'
        envars:
          FHR: "#fhr#"
        nodes: "{{ post.aigfs_post.execution.batchargs.nodes }}:ppn={{ post.aigfs_post.execution.batchargs.tasks_per_node }}"
        memory: "{{ post.aigfs_post.execution.batchargs.memory }}"
        walltime: "{{ post.aigfs_post.execution.batchargs.walltime }}"
        dependency:
          or:
            and:
              datadep_pres:
                value:
                  cyclestr:
                    value: "{{ user.rundir }}/@Y@m@d@H/forecast/aigfs.t@Hz.pres.f#nextfhr#.grib2"
              datadep_sfc:
                value:
                  cyclestr:
                    value: "{{ user.rundir }}/@Y@m@d@H/forecast/aigfs.t@Hz.sfc.f#nextfhr#.grib2"
            taskdep:
              attrs:
                task: forecast
