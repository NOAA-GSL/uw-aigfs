app:
  pretrained_model_path: /home/role.rtaigfs/weights
platform:
  scheduler: slurm
prep:
    files_to_hardlink:
      data/gfs.t{{ timevars.cyc }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/{{ user.yyyymmdd }}/gfs.t{{ timevars.cyc }}z.pgrb2.0p25.f000'
      data/gfs.t{{ user.m1_cyc }}z.pgrb2.0p25.f000: '{{ user.gfs_data }}/{{ user.m1_yyyymmdd }}/gfs.t{{ user.m1_cyc}}z.pgrb2.0p25.f000'
      data/gfs.t{{ user.m1_cyc }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/{{ user.m1_yyyymmdd }}/gfs.t{{ user.m1_cyc}}z.pgrb2.0p25.f006'
      data/gfs.t{{ user.m2_cyc }}z.pgrb2.0p25.f006: '{{ user.gfs_data }}/{{ user.m2_yyyymmdd }}/gfs.t{{ user.m2_cyc }}z.pgrb2.0p25.f006'
user:
  gfs_data: /public/data/grids/gfs/0p25deg/grib2
  m1_cyc: '{{ (cycle - app.cycle_freq).strftime("%H") }}'
  m1_yyyymmdd: '{{ (cycle - app.cycle_freq).strftime("%Y%m%d") }}'
  m2_cyc: '{{ (cycle - 2*app.cycle_freq).strftime("%H") }}'
  m2_yyyymmdd: '{{ (cycle - 2*app.cycle_freq).strftime("%Y%m%d") }}'
  yyyymmdd: '{{ cycle.strftime("%Y%m%d") }}'
